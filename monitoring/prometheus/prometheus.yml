global:
  scrape_interval: 10s

scrape_configs:
  - job_name: 'cadvisor_baia1'
    static_configs:
      - targets: ['10.10.40.151:8081']  # cAdvisor da máquina 1
    metrics_path: '/metrics'
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
      - target_label: machine
        replacement: 'baia1'

  - job_name: 'cadvisor_baia2'
    static_configs:
      - targets: ['10.10.40.152:8082']  # cAdvisor da máquina 2
    metrics_path: '/metrics'
